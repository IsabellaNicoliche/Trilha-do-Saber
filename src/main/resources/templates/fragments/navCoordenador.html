<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="nav(pagina, usuarioLogado)" class="topbar">
    <div class="marca-topbar">
        <img th:src="@{/css/img/icons/img/logo.png}" alt="Trilha do Saber" class="logo-marca">
        <div>
            <strong>Trilha do Saber</strong>
            <span>Coordenador</span>
        </div>
    </div>

    <nav class="menu-topbar">
        <a th:href="@{/coordenador/inicio}" class="item-menu" th:classappend="${pagina == 'inicio'} ? ' ativo' : ''"><img th:src="@{/css/img/icons/img/iconeinicio.png}" alt="Início" class="icone-menu"> Início</a>
        <a th:href="@{/coordenador/usuarios}" class="item-menu" th:classappend="${pagina == 'usuarios'} ? ' ativo' : ''"><img th:src="@{/css/img/icons/img/iconeusua.png}" alt="Usuários" class="icone-menu"> Usuários</a>
        <a th:href="@{/coordenador/turmas}" class="item-menu" th:classappend="${pagina == 'turmas'} ? ' ativo' : ''"><img th:src="@{/css/img/icons/img/iconeturma.png}" alt="Turmas" class="icone-menu"> Turmas</a>
        <a th:href="@{/coordenador/dashboard}" class="item-menu" th:classappend="${pagina == 'dashboard'} ? ' ativo' : ''"><img th:src="@{/css/img/icons/img/iconedash.png}" alt="Desempenho" class="icone-menu"> Desempenho</a>
        <a th:href="@{/arquivoPDF}" class="item-menu" th:classappend="${pagina == 'importar'} ? ' ativo' : ''"><img th:src="@{/css/img/icons/img/iconeprova.png}" alt="Importar Provas" class="icone-menu"> Importar Provas</a>
        <a th:href="@{/conta}" class="item-menu" th:classappend="${pagina == 'conta'} ? ' ativo' : ''"><img th:src="@{/css/img/icons/img/iconeconta.png}" alt="Minha Conta" class="icone-menu"> Minha Conta</a>
    </nav>

    <div class="perfil-topbar">
        <div class="avatar-usuario">CO</div>
        <div>
            <strong th:text="${usuarioLogado != null} ? ${usuarioLogado.nome} : 'Coordenação'">Coordenação</strong>
            <span th:text="${usuarioLogado != null} ? ${usuarioLogado.email} : 'coordenacao@umc.br'">coordenacao@umc.br</span>
        </div>
        <a th:href="@{/cadastro/termos-lgpd}" target="_blank" class="link-sair">Termo de Uso</a>
        <a th:href="@{/logout}" class="link-sair">Sair</a>
    </div>
</header>

</body>
</html>
