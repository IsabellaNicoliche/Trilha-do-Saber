<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novo professor</title>
    <link rel="stylesheet" th:href="@{/css/painel.css}">
</head>
<body>

<header th:replace="~{fragments/navAdmin :: nav(pagina='usuarios', usuarioLogado=${usuarioLogado})}"></header>

<main class="conteudo">
    <div class="cartao-form">

        <h1>Novo professor</h1>
        <p class="subtitulo-pagina">O acesso já é liberado na hora. Uma senha provisória será enviada para o e-mail informado.</p>

        <span class="erro-geral" th:if="${erroGeral}" th:text="${erroGeral}"></span>

        <form method="post" th:object="${professorNovoForm}" th:action="@{/admin/usuarios/professor/novo}">

            <label>Nome completo</label>
            <input type="text" th:field="*{nome}" placeholder="Ana Lima Ferreira">
            <span class="erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>

            <label>E-mail institucional</label>
            <input type="email" th:field="*{email}" placeholder="ana.lima@uni.edu.br">
            <span class="erro" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

            <label>Registro de funcionário</label>
            <input type="text" th:field="*{registroProfissional}" placeholder="20240001">
            <span class="erro" th:if="${#fields.hasErrors('registroProfissional')}" th:errors="*{registroProfissional}"></span>

            <div class="acoes-form">
                <a th:href="@{/admin/coordenadores}" class="botao-secundario">Cancelar</a>
                <button type="submit" class="botao-primario">Criar professor</button>
            </div>
        </form>

    </div>
</main>

</body>
</html>
