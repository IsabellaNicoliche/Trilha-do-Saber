<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coordenador</title>
  <link rel="stylesheet" th:href="@{/css/painel.css}">
</head>
<body>

<header th:replace="~{fragments/navAdmin :: nav(pagina='usuarios', usuarioLogado=${usuarioLogado})}"></header>

<main class="conteudo">
  <div class="cartao-form">

    <h1>Editar coordenador</h1>

    <form method="post" th:object="${coordenadorForm}"
          th:action="@{/admin/coordenadores/{id}(id=${coordenadorForm.id})}">

      <input type="hidden" th:field="*{id}">

      <label>Nome</label>
      <input type="text" th:field="*{nome}">
      <span class="erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>

      <label>Email</label>
      <input type="email" th:field="*{email}">
      <span class="erro" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

      <label>Registro de funcionário</label>
      <input type="text" th:field="*{registroFuncional}">
      <span class="erro" th:if="${#fields.hasErrors('registroFuncional')}" th:errors="*{registroFuncional}"></span>

      <label>Curso principal</label>
      <select th:field="*{curso}" id="curso">
        <option value="">Selecionar curso</option>
        <option th:each="c : ${T(com.tcc.trilha_do_saber.model.Curso).values()}"
                th:value="${c.nomeExibicao}" th:text="${c.nomeExibicao}"></option>
      </select>
      <span class="erro" th:if="${#fields.hasErrors('curso')}" th:errors="*{curso}"></span>

      <label class="opcao-curso">
        <input type="checkbox" id="outrosCursos"
               th:checked="${!#lists.isEmpty(coordenadorForm.cursosAdicionais)}">
        <span>Coordena outros cursos</span>
      </label>

      <div id="blocoOutrosCursos" class="bloco-outros-cursos"
           th:classappend="${#lists.isEmpty(coordenadorForm.cursosAdicionais)} ? 'oculto'">
        <label>Marque os outros cursos</label>
        <label class="opcao-curso" th:each="c : ${T(com.tcc.trilha_do_saber.model.Curso).values()}">
          <input type="checkbox" th:field="*{cursosAdicionais}" th:value="${c.nomeExibicao}">
          <span th:text="${c.nomeExibicao}"></span>
        </label>
      </div>

      <label class="campo-checkbox">
        <input type="checkbox" th:field="*{ativo}">
        Cadastro aprovado (acesso liberado)
      </label>

      <div class="acoes-form">
        <a th:href="@{/admin/coordenadores}" class="botao-secundario">Cancelar</a>
        <button type="submit" class="botao-primario">Salvar</button>
      </div>
    </form>

    <div class="zona-perigo">
      <h2>Zona de risco</h2>

      <div class="linha-zona-perigo">
        <div>
          <strong>Excluir usuário</strong>
          <p>Remove o acesso e marca como excluído. Os dados continuam no banco.</p>
        </div>
        <form th:action="@{/admin/coordenadores/{id}/excluir(id=${coordenadorForm.id})}" method="post">
          <button type="submit" class="botao-perigo" onclick="return confirm('Excluir este coordenador? Os dados continuam no banco.');">Excluir</button>
        </form>
      </div>

      <div class="linha-zona-perigo">
        <div>
          <strong>Anonimizar dados (LGPD)</strong>
          <p>Apaga nome, email e demais dados pessoais definitivamente. Não pode ser desfeito.</p>
        </div>
        <form th:action="@{/admin/coordenadores/{id}/anonimizar(id=${coordenadorForm.id})}" method="post">
          <button type="submit" class="botao-perigo" onclick="return confirm('Essa ação é definitiva. Anonimizar os dados deste coordenador?');">Anonimizar</button>
        </form>
      </div>
    </div>

  </div>
</main>

<script>
  const cursoPrincipal = document.getElementById('curso');
  const outrosCursos = document.getElementById('outrosCursos');
  const bloco = document.getElementById('blocoOutrosCursos');

  function atualizar() {
      bloco.classList.toggle('oculto', !outrosCursos.checked);

      bloco.querySelectorAll('input[type=checkbox]').forEach(caixa => {
          const repetido = caixa.value === cursoPrincipal.value;
          caixa.closest('label').classList.toggle('oculto', repetido);

          if (repetido || !outrosCursos.checked) {
              caixa.checked = false;
          }
      });
  }

  outrosCursos.addEventListener('change', atualizar);
  cursoPrincipal.addEventListener('change', atualizar);
  atualizar();
</script>

</body>
</html>
