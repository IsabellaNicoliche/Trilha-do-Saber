<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Início</title>
    <link rel="stylesheet" th:href="@{/css/painel.css}">
</head>
<body>

<header class="topbar">
    <div class="marca-topbar">
        <span class="logo-marca">📘</span>
        <div>
            <strong>Trilha do Saber</strong>
            <span>Professor</span>
        </div>
    </div>

    <nav class="menu-topbar">
        <a th:href="@{/professor/inicio}" class="item-menu ativo"><span>🏠</span> Início</a>
        <a th:href="@{/professor/alunos}" class="item-menu"><span>👥</span> Alunos</a>
        <a href="#" class="item-menu"><span>📈</span> Desempenho da Turma</a>
        <a href="#" class="item-menu"><span>📤</span> Conteúdo de Aula</a>
        <a href="#" class="item-menu"><span>👤</span> Minha Conta</a>
    </nav>

    <div class="perfil-topbar">
        <div class="avatar-usuario">PR</div>
        <div>
            <strong th:text="${usuario.nome}">Professor</strong>
            <span th:text="${usuario.email}">professor@umc.br</span>
        </div>
        <a th:href="@{/cadastro/termos-lgpd}" target="_blank" class="link-sair">Termo de Uso</a>
        <a th:href="@{/logout}" class="link-sair">Sair</a>
    </div>
</header>

<main class="conteudo">

    <header class="topo-conteudo">
        <h1>Início</h1>
        <p class="subtitulo-pagina" th:text="'Visão geral da turma — ' + ${usuario.nome}">Visão geral da turma</p>
    </header>

    <section class="grade-cards">
        <div class="card-estatistica">
            <span class="rotulo-card">Alunos ativos</span>
            <strong class="numero-card">-</strong>
        </div>
        <div class="card-estatistica">
            <span class="rotulo-card">Média geral da turma</span>
            <strong class="numero-card">-</strong>
        </div>
        <div class="card-estatistica">
            <span class="rotulo-card">Simulados concluídos</span>
            <strong class="numero-card">-</strong>
        </div>
        <div class="card-estatistica">
            <span class="rotulo-card">Temas críticos</span>
            <strong class="numero-card">-</strong>
        </div>
    </section>

</main>

</body>
</html>
