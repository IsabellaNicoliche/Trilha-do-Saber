<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logs de Auditoria</title>
    <link rel="stylesheet" th:href="@{/css/painel.css}">
    <style>
        .conteudo {
            max-width: 1500px;
        }

        .tabela-logs {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .tabela-logs th,
        .tabela-logs td {
            text-align: left;
            padding: 12px 16px;
            border-bottom: 1px solid var(--borda);
            font-size: 13px;
            white-space: normal;
            word-wrap: break-word;
            vertical-align: top;
        }

        .tabela-logs th {
            background: var(--marca-fundo);
            color: var(--texto-secundario);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
        }

        .tabela-logs tr:last-child td {
            border-bottom: none;
        }

        .col-data { width: 10%; }
        .col-usuario { width: 11%; }
        .col-tipo { width: 7%; }
        .col-acao { width: 9%; }
        .col-entidade { width: 9%; }
        .col-descricao { width: 30%; color: var(--texto-secundario); line-height: 1.5; }
        .col-ip { width: 10%; font-family: monospace; font-size: 12px; }
        .col-duracao { width: 6%; }
        .col-integridade { width: 8%; }

        .tabela-logs-container {
            background: #fff;
            border: 1px solid var(--borda);
            border-radius: 12px;
            overflow: hidden;
        }
    </style>
</head>
<body>

<header th:replace="~{fragments/navAdmin :: nav(pagina='logs', usuarioLogado=${usuarioLogado})}"></header>

<main class="conteudo">

    <header class="topo-conteudo">
        <h1>Logs de Auditoria</h1>
        <p class="subtitulo-pagina">Registro de acessos e ações do sistema, conforme Marco Civil da Internet e LGPD</p>
    </header>

    <section class="grade-cards">
        <div class="card-estatistica">
            <span class="rotulo-card">Total de registros</span>
            <strong class="numero-card" th:text="${logs.size()}"></strong>
        </div>
        <div class="card-estatistica">
            <span class="rotulo-card">Íntegros</span>
            <strong class="numero-card" th:text="${logs.?[integro].size()}"></strong>
        </div>
        <div class="card-estatistica">
            <span class="rotulo-card">Com adulteração detectada</span>
            <strong class="numero-card" th:text="${logs.?[!integro].size()}"></strong>
        </div>
    </section>

    <div class="cabecalho-usuarios">
        <h2>Registros</h2>
    </div>

    <div class="tabela-logs-container">
        <table class="tabela-logs">
            <thead>
            <tr>
                <th class="col-data">Data/Hora</th>
                <th class="col-usuario">Usuário</th>
                <th class="col-tipo">Tipo</th>
                <th class="col-acao">Ação</th>
                <th class="col-entidade">Entidade</th>
                <th class="col-descricao">Descrição</th>
                <th class="col-ip">IP</th>
                <th class="col-duracao">Duração</th>
                <th class="col-integridade">Integridade</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="log : ${logs}">
                <td class="col-data" th:text="${#temporals.format(log.dataHora, 'dd/MM/yyyy HH:mm:ss')}"></td>
                <td class="col-usuario" th:text="${log.usuarioNome}"></td>
                <td class="col-tipo" th:text="${log.usuarioTipo}"></td>
                <td class="col-acao" th:text="${log.acao}"></td>
                <td class="col-entidade" th:text="${log.entidadeTipo} + (${log.entidadeId} != null ? (' #' + ${log.entidadeId}) : '')"></td>
                <td class="col-descricao" th:text="${log.detalhes} != null ? ${log.detalhes} : '-'"></td>
                <td class="col-ip" th:text="${log.ip} != null ? ${log.ip} : '-'"></td>
                <td class="col-duracao" th:text="${log.duracaoMs} != null ? (${log.duracaoMs} + ' ms') : '-'"></td>
                <td class="col-integridade">
                    <span class="badge-status" th:classappend="${log.integro} ? 'badge-ativo' : 'badge-inativo'"
                          th:text="${log.integro} ? 'Íntegro' : 'Adulterado'"></span>
                </td>
            </tr>
            <tr th:if="${logs.isEmpty()}">
                <td colspan="9" class="linha-vazia">Nenhum registro de auditoria ainda</td>
            </tr>
            </tbody>
        </table>
    </div>

</main>

</body>
</html>
