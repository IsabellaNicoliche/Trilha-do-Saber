<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar turma</title>
    <link rel="stylesheet" th:href="@{/css/painel.css}">
    <link rel="stylesheet" th:href="@{/css/turmas.css}">
</head>
<body>

<header th:if="${ehAdmin}" th:replace="~{fragments/navAdmin :: nav(pagina='turmas', usuarioLogado=${usuario})}"></header>
<header th:unless="${ehAdmin}" th:replace="~{fragments/navCoordenador :: nav(pagina='turmas', usuarioLogado=${usuario})}"></header>

<main class="conteudo">
    <div class="cartao-form">

        <h1>Editar turma</h1>

        <p class="dados-fixos">
            <span>Curso: <strong th:text="${alocacao.curso}">Sistemas de Informação</strong></span>
            <span>Período letivo: <strong th:text="${alocacao.periodoLetivo}">2026/2</strong></span>
        </p>

        <div class="alerta-importacao" th:if="${erro}" th:text="${erro}">Já existe a disciplina Redes nesta turma.</div>

        <form method="post" th:object="${form}" th:action="@{|${base}/${alocacao.id}/editar|}">

            <label>Disciplina</label>
            <input type="text" th:field="*{disciplina}">
            <span class="erro" th:if="${#fields.hasErrors('disciplina')}" th:errors="*{disciplina}"></span>

            <label>Semestre</label>
            <input type="number" th:field="*{semestre}" min="1" max="12">
            <span class="erro" th:if="${#fields.hasErrors('semestre')}" th:errors="*{semestre}"></span>

            <label>Turma</label>
            <select th:field="*{turma}">
                <option value="">Selecionar</option>
                <option th:each="t : ${T(com.tcc.trilha_do_saber.model.Turma).values()}"
                        th:value="${t.nomeExibicao}" th:text="${t.nomeExibicao}"></option>
            </select>
            <span class="erro" th:if="${#fields.hasErrors('turma')}" th:errors="*{turma}"></span>

            <label>Período de estudo</label>
            <select th:field="*{turno}">
                <option value="">Selecionar</option>
                <option th:each="p : ${T(com.tcc.trilha_do_saber.model.Turno).values()}"
                        th:value="${p.nomeExibicao}" th:text="${p.nomeExibicao}"></option>
            </select>
            <span class="erro" th:if="${#fields.hasErrors('turno')}" th:errors="*{turno}"></span>

            <label>Professores</label>
            <div class="lista-professores">
                <label class="opcao-professor" th:each="p : ${professores}">
                    <input type="checkbox" th:field="*{professorIds}" th:value="${p.id}">
                    <span th:text="${p.nome} + ' (' + ${p.email} + ')'">Ana Souza (ana@umc.br)</span>
                </label>
            </div>
            <span class="dica-professores">Marque mais de um professor quando a disciplina for dividida entre eles (por exemplo, quarta-feira com um e sexta-feira com outro).</span>
            <span class="erro" th:if="${#fields.hasErrors('professorIds')}" th:errors="*{professorIds}"></span>

            <div class="acoes-form">
                <a th:href="@{|${base}?periodo=${alocacao.periodoLetivo}|}" class="botao-secundario">Cancelar</a>
                <button type="submit" class="botao-primario">Salvar</button>
            </div>
        </form>

    </div>
</main>

</body>
</html>
