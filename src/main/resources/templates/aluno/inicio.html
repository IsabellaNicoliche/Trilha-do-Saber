<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Início</title>
    <link rel="stylesheet" th:href="@{/css/painel.css}">
</head>
<body>

<header class="topbar">
    <div class="marca-topbar">
        <span class="logo-marca">📘</span>
        <div>
            <strong>Trilha do Saber</strong>
            <span>Aluno</span>
        </div>
    </div>

    <nav class="menu-topbar">
        <a th:href="@{/aluno/inicio}" class="item-menu ativo"><span>🏠</span> Início</a>
        <a th:href="@{/simulado/iniciar}" class="item-menu"><span>📝</span> Simulados</a>
        <a th:href="@{/aluno/dashboard}" class="item-menu"><span>📈</span> Meu Desempenho</a>
        <a href="#" class="item-menu"><span>👤</span> Minha Conta</a>
    </nav>

    <div class="perfil-topbar">
        <div class="avatar-usuario">AL</div>
        <div>
            <strong th:text="${usuario.nome}">Aluno</strong>
            <span th:text="${usuario.email}">aluno@umc.br</span>
        </div>
        <a th:href="@{/cadastro/termos-lgpd}" target="_blank" class="link-sair">Termo de Uso</a>
        <a th:href="@{/logout}" class="link-sair">Sair</a>
    </div>
</header>

<main class="conteudo">

    <header class="topo-conteudo">
        <h1>Início</h1>
        <p class="subtitulo-pagina" th:text="'Bom dia, ' + ${usuario.nome} + '. Continue sua preparação para o ENADE.'">Bom dia. Continue sua preparação para o ENADE.</p>
    </header>

    <section class="grade-cards">
        <div class="card-estatistica">
            <span class="rotulo-card">Simulados realizados</span>
            <strong class="numero-card">0</strong>
        </div>
        <div class="card-estatistica">
            <span class="rotulo-card">Média geral</span>
            <strong class="numero-card">-</strong>
        </div>
        <div class="card-estatistica">
            <span class="rotulo-card">Tema mais forte</span>
            <strong class="numero-card">-</strong>
        </div>
        <div class="card-estatistica">
            <span class="rotulo-card">Tema mais fraco</span>
            <strong class="numero-card">-</strong>
        </div>
    </section>

</main>

</body>
</html>
