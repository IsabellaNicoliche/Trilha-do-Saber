<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verificação em duas etapas</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div class="pagina-cadastro">
    <div class="cartao-cadastro">

        <a th:href="@{/login}" class="link-voltar">‹ Voltar</a>

        <span class="icone-cadeado">🔒</span>

        <h1>Verificação em duas etapas</h1>
        <p class="subtitulo">Enviamos um código de 6 dígitos para o seu e-mail. Digite-o abaixo para continuar.</p>

        <span class="aviso-info" th:if="${emailIndisponivel}">Não foi possível enviar o código por e-mail agora. Aguarde alguns instantes e clique em "Reenviar código".</span>
        <span class="erro-geral" th:if="${erroVerificacao}" th:text="${erroVerificacao}"></span>
        <form method="post" th:action="@{/verificacao}">

            <label>Código de verificação</label>
            <div class="grade-codigo">
                <input type="text" name="d1" maxlength="1" inputmode="numeric" autocomplete="one-time-code" required>
                <input type="text" name="d2" maxlength="1" inputmode="numeric" required>
                <input type="text" name="d3" maxlength="1" inputmode="numeric" required>
                <input type="text" name="d4" maxlength="1" inputmode="numeric" required>
                <input type="text" name="d5" maxlength="1" inputmode="numeric" required>
                <input type="text" name="d6" maxlength="1" inputmode="numeric" required>
            </div>

            <button type="submit" class="botao-primario botao-largo">Confirmar código</button>
        </form>

        <form method="post" th:action="@{/verificacao/reenviar}">
            <p class="rodape-login">Não recebeu? <button type="submit" class="botao-link">Reenviar código</button></p>
        </form>

    </div>
</div>

<script>
    const campos = document.querySelectorAll(".grade-codigo input");
    campos.forEach((campo, indice) => {
        campo.addEventListener("input", () => {
            campo.value = campo.value.replace(/\D/g, "");
            if (campo.value && indice < campos.length - 1) {
                campos[indice + 1].focus();
            }
        });
        campo.addEventListener("keydown", (evento) => {
            if (evento.key === "Backspace" && !campo.value && indice > 0) {
                campos[indice - 1].focus();
            }
        });
    });
</script>

</body>
</html>
